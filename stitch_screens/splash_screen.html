<style>

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); filter: blur(40px); }
      50% { opacity: 1; transform: scale(1.1); filter: blur(60px); }
    }
    
    .spark-glow {
      background: radial-gradient(circle, #04b4a2 0%, transparent 70%);

    }

</footer>
<script>
    // Lightweight loader animation logic
    const loader = document.getElementById('loader-bar');
    let width = 0;
    
    // Simulate initial loading sequence for UX feel
    function animateLoader() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 2;
        if (progress > 100) {
          progress = 100;
          clearInterval(interval);
          // Optional: redirect or transition after "loading"
          console.log("App ready");
        }
        loader.style.width = progress + '%';
      }, 50);
    }

    window.addEventListener('DOMContentLoaded', animateLoader);

    // Mouse proximity effect for the glow
    document.addEventListener('mousemove', (e) => {
      const glow = document.querySelector('.spark-glow');
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      glow.style.transform = `translate(${x}px, ${y}px) scale(1.1)`;
    });
  </script>
<style>
    @keyframes loading {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(200%); }
