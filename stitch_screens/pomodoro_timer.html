<script>
        // Simple Pomodoro State Machine
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let timerInterval;

        const timerDisplay = document.getElementById('timer-display');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const resetBtn = document.getElementById('reset-btn');
        const progressCircle = document.getElementById('timer-ring-circle');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update Circle
            const offset = (timeLeft / totalTime) * 289.027;
            progressCircle.style.strokeDashoffset = 289.027 - offset;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                playPauseIcon.textContent = 'play_arrow';
            } else {
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        playPauseIcon.textContent = 'play_arrow';
                        // Logic for end of session could go here
                    }
                }, 1000);
                playPauseIcon.textContent = 'pause';
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 25 * 60;
            playPauseIcon.textContent = 'play_arrow';
            updateDisplay();
        }

        playPauseBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Initial Display Update
        updateDisplay();
    </script>
