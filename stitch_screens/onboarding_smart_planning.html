<style>
        .ai-glow {
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
        }
        .teal-glow {
            box-shadow: 0 0 30px rgba(20, 184, 166, 0.25);
        }
        .glass-panel {
            background: rgba(23, 31, 51, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top AppBar Suppressed for Onboarding as per "Shell Visibility & Relevance" rule -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative overflow-hidden">
<!-- Background Ambient Elements -->
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-tertiary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-secondary/10 rounded-full blur-[100px]"></div>
<!-- Illustration Section -->
<div class="w-full max-w-md aspect-square relative mb-xl flex items-center justify-center">
<!-- Central Calendar Illustration -->
<div class="relative w-72 h-72 lg:w-96 lg:h-96 glass-panel rounded-xl teal-glow animate-pulse-glow overflow-hidden">
<img alt="Futuristic Calendar Illustration" class="w-full h-full object-cover mix-blend-lighten opacity-80" data-alt="A futuristic digital calendar interface floating in a dark, holographic space. The interface features minimalist translucent glass cards with glowing teal highlights and neon grid lines. High-energy lighting effects in secondary teal and tertiary purple create a sophisticated, AI-driven intelligent atmosphere. The background is a deep navy blue, consistent with a premium productivity application's dark mode." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDg_VNqLyig6FMSkVGfXFe4yWWEH2n_sMIqg5RLjYD5prAqg3yj8ObX7TdflIs9OAYYF-bf6npEQT2PVtymFdXtOtgix93HttKHac3cFVxPSNSQmnIPN9oCuDD8yWcSFf-mSP-Vm2_jK1Rdnbmy-MLyyQbseWpFDyHD_9aViH_uPv-NesZq8TDhhPjKoSgIbXNZ5sFXAm6BcZRYgBKlvxLn-E1oyWJdyMCeMibteF8ocw62Wps7BMCuL_7ne-D3RfPeFwLyiS45WZI"/>
<!-- Floating UI Decorative Elements -->
<div class="absolute top-4 right-4 glass-panel p-2 rounded-lg teal-glow">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">colors_spark</span>
</div>
<div class="absolute bottom-6 left-6 glass-panel px-4 py-2 rounded-full border border-secondary/30">
<span class="text-secondary font-label-sm text-label-sm">Optimization Active</span>
</div>
</div>
<!-- Abstract Floating Nodes (Visual Meta-data) -->
<div class="absolute -top-4 -left-4 w-12 h-12 rounded-full bg-primary/20 backdrop-blur-xl border border-primary/30 flex items-center justify-center ai-glow">
<span class="material-symbols-outlined text-primary text-[20px]">event_repeat</span>
</div>
<div class="absolute bottom-20 -right-6 w-16 h-16 rounded-full bg-tertiary/20 backdrop-blur-xl border border-tertiary/30 flex items-center justify-center ai-glow">
<span class="material-symbols-outlined text-tertiary text-[24px]">auto_awesome</span>
</div>
</div>
<!-- Text Content Area -->
<div class="text-center w-full max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-md text-on-surface tracking-tight">
                Your AI Academic Assistant
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant px-2 leading-relaxed">
                StudySpark learns your habits to create the perfect study schedule tailored just for you.
            </p>
</div>
</main>
<!-- Footer Action Area -->
<footer class="w-full px-margin-mobile pb-xl pt-lg flex flex-col items-center">
<!-- Pagination Dots -->
<div class="flex gap-sm mb-xl">
<div class="w-6 h-2 rounded-full bg-secondary teal-glow"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<!-- Next Button -->
<button class="w-full max-w-md h-14 bg-secondary-container text-on-secondary-container font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-sm teal-glow transition-all active:scale-95">
<span>Next</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Skip Action -->
<button class="mt-md text-on-surface-variant font-label-sm text-label-sm hover:text-on-surface transition-colors">
            Skip Intro
        </button>
</footer>
<!-- Bottom Navigation Suppressed for Onboarding as per "Shell Visibility & Relevance" rule -->
<script>
        // Simple micro-interaction for the next button
        const nextBtn = document.querySelector('button');
        nextBtn.addEventListener('mousedown', () => {
            nextBtn.classList.add('brightness-110');
        });
        nextBtn.addEventListener('mouseup', () => {
            nextBtn.classList.remove('brightness-110');
        });

        // Floating animation effect for abstract nodes
        const nodes = document.querySelectorAll('.ai-glow');
        nodes.forEach((node, index) => {
            node.style.animation = `float ${3 + index}s ease-in-out infinite alternate`;
        });

        // Keyframe injection for float animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes float {
                from { transform: translateY(0px); }
                to { transform: translateY(-15px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body></html>
