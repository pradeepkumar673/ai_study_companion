<style>
    body {

    }

  </head>
<body class="bg-surface text-on-surface min-h-screen font-body-md overflow-x-hidden selection:bg-secondary/30">
<!-- Top AppBar (from JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl flex justify-between items-center px-margin-mobile py-sm w-full">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full transition-colors duration-200" onclick="history.back()">
                arrow_back
            </button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">Add New Task</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a diverse university student looking confident and friendly. The lighting is soft and natural, suggesting a high-end campus environment. The image uses a cool-toned color palette with deep blues and teals to match the StudySpark brand aesthetic. The background is a slightly blurred modern library setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7KJ2NuNyG9EVpxmXMniok6Pq8Z-xkztD6ajS4jaWYY4vyUR2dYsBeAGquAZDTeBNL9G_cTrCssNDspiycYO0eDLxZV5azAnhc4MaN276y4xWP7m0JXbCc3HDqFCEmPtz5MDmht8szFOIJ-Iu1oPQQ99TI9ba-AsggIDc09M0wUb2VN_4jIWCNTL9djRZipK5qmOysxKH1P4YbnlVEqA7miFfyrhHX-Kdk7Mqvi2XM8O97gkVoXYStlBBpLz_Jvgv92dQ_Jq7chWI"/>
</div>
</div>
</header>
<main class="pt-24 pb-32 px-margin-mobile max-w-2xl mx-auto">
<!-- Form Container -->
<div class="space-y-lg">
<!-- Hero Illustration/Visual -->
<div class="relative w-full h-40 rounded-xl overflow-hidden glass-card mb-xl">
<img class="w-full h-full object-cover opacity-40" data-alt="A minimalist overhead view of a clean desk with a laptop, a notebook, and a single green plant. The scene is bathed in soft, cool moonlight-style lighting, emphasizing a focused and calm study environment. The color scheme is dominated by deep navy blues and glowing teal accents, creating a high-energy yet sophisticated academic atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXP-DrliAE__Th-rJsIS393UwvfNHjqgX4pFbM-yiMjoaQLqfSzOSkWdmMDdVLUhkmojf9-QK_Wy00QHM81nQKT74zmlYFn_ZBvlZFusMbubX5YTZ-uajh2w8vFRlkSOnjEhHF5U6uqneIcSUyV_mkGhyUSzK48Zh3WhvT07ALaQk1W958MJXByd8E_XJvJ5WCpUtsVHWzu_HO5sOgM_NowTACrzKGgi5ui8RVW76lj7SFfgLSyus6IN2YTJxprraFP1edw2FctYk"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent"></div>
<div class="absolute bottom-4 left-4">
<p class="font-label-lg text-label-lg text-secondary">Organize your thoughts</p>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">New Academic Goal</h2>
</div>
</div>
<!-- Task Title -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="task-title">Task Title</label>
<input class="w-full bg-surface-container-high border-outline-variant text-on-surface px-md py-md rounded-lg font-body-md transition-all duration-200 placeholder:text-outline" id="task-title" placeholder="e.g., Quantum Physics Research Paper" type="text"/>
</div>
<!-- Subject & Due Date Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="subject">Subject</label>
<div class="relative">
<select class="w-full bg-surface-container-high border-outline-variant text-on-surface px-md py-md rounded-lg appearance-none font-body-md" id="subject">
<option value="">Select a subject</option>
<option value="math">Mathematics</option>
<option value="physics">Theoretical Physics</option>
<option value="bio">Organic Chemistry</option>
<option value="lit">Modern Literature</option>
<option value="cs">Computer Science</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="due-date">Due Date</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-outline-variant text-on-surface px-md py-md rounded-lg font-body-md [color-scheme:dark]" id="due-date" type="date"/>
</div>
</div>
</div>
<!-- Priority Segmented Control -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Priority Level</label>
<div class="flex p-1 bg-surface-container-high rounded-xl border border-outline-variant">
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:bg-surface-variant/30" onclick="setPriority(this, 'low')" type="button">Low</button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-200 bg-secondary-container text-on-secondary-container" onclick="setPriority(this, 'medium')" type="button">Medium</button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:bg-surface-variant/30" onclick="setPriority(this, 'high')" type="button">High</button>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="notes">Notes &amp; Requirements</label>
<textarea class="w-full bg-surface-container-high border-outline-variant text-on-surface px-md py-md rounded-lg font-body-md resize-none" id="notes" placeholder="Mention key resources or specific chapters..." rows="4"></textarea>
</div>
<!-- AI Assist Toggle -->
<div class="glass-card p-md rounded-xl flex items-center justify-between group transition-all duration-300 hover:ai-glow">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<h4 class="font-label-lg text-label-lg text-on-surface">AI Smart Estimation</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant">Automatically calculate duration based on task complexity</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
<!-- Estimated Time (AI Controlled) -->
<div class="bg-tertiary/10 border border-tertiary/20 p-md rounded-xl flex items-center gap-md" id="ai-suggestion">
<span class="material-symbols-outlined text-tertiary text-[20px]">timer</span>
<p class="font-body-md text-on-tertiary-container">AI Suggestion: <span class="font-bold">4.5 hours</span> to complete this task.</p>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile glass-card flex gap-md">
<button class="flex-1 py-4 bg-secondary text-on-secondary-container font-headline-md text-headline-md rounded-xl transition-all duration-150 active:scale-95 shadow-lg shadow-secondary/20 font-bold">
            Save Task
        </button>
<button class="px-6 py-4 border-2 border-outline-variant text-on-surface-variant font-label-lg text-label-lg rounded-xl hover:bg-surface-variant/30 transition-colors duration-200">
            Cancel
        </button>
</footer>
<!-- Bottom Navigation (from JSON) - Hidden on Task focused screen as per "Task-Focused" rule -->
<!-- The prompt implies a focused journey "Add New Task", so BottomNavBar is suppressed to prioritize the task creation canvas -->
<script>
        function setPriority(el, level) {
            const buttons = el.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                btn.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/30');
            });
            el.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/30');
            el.classList.add('bg-secondary-container', 'text-on-secondary-container');
        }

        // Simple Toggle Behavior for AI Suggestion
        const aiToggle = document.querySelector('input[type="checkbox"]');
        const aiSuggestion = document.getElementById('ai-suggestion');

        aiToggle.addEventListener('change', () => {
            if (aiToggle.checked) {
                aiSuggestion.classList.remove('hidden');
                aiSuggestion.classList.add('flex');
            } else {
                aiSuggestion.classList.add('hidden');
                aiSuggestion.classList.remove('flex');
            }
        });
    </script>
</body></html>
