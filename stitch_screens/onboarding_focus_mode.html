<style>
    .glass-effect {
      background: rgba(23, 31, 51, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .ai-glow {
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.25);
    }
    .floating-anim {
      animation: floating 4s ease-in-out infinite;
    }
    @keyframes floating {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #0b1326;
      color: #dae2fd;
      overflow: hidden;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Background Atmospheric Glows -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-tertiary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Onboarding Illustration Container -->
<div class="w-full max-w-lg mb-xl relative flex items-center justify-center overflow-hidden h-[360px]">
<!-- Illustration -->
<div class="relative w-full h-full flex items-center justify-center">
<img alt="Student in focus mode" class="z-10 object-contain h-[320px]" data-alt="A cinematic 3D digital illustration of a student sitting in a cross-legged zen-like meditative pose, hovering slightly above a dark reflective surface. A glowing, holographic Pomodoro timer with a soft teal light floats in front of them. The background is a deep navy space filled with soft purple and teal particles. The lighting is ethereal and high-contrast, with a soft purple ai-glow emanating from the student's silhouette, emphasizing a calm, focused, and futuristic atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQlxA_wYJy4VCtgJEn5Ly0VR-Tkf5gsUyieVqsv3oghF9hzRA3JOL6VsRQeelkOJJPaj1Z0D-IEMrmmrTRWV_kC44mzNZKHHm67D8kaej-VILrM_FtpaN2wcuOOXz2Kb9847hCiYXzMYKvYYRPuUjAFmaZqEPC-_I6ELhlhzzoEcYEKU24Tw7t6kqffV_V3T4l-9_Wtb2H3HHaHYufGzh5hAS3gGsp9QXuLeRDTVDCKmDsWdgaxKQ1GXXqsfIPulOZsXKELXPEhLc"/>
<!-- Floating Elements -->
<div class="absolute top-10 right-10 floating-anim" style="animation-delay: 0.5s;">
<div class="glass-effect p-md rounded-xl ai-glow border-tertiary/20">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<div class="h-1.5 w-12 bg-tertiary/20 rounded-full mt-2"></div>
</div>
</div>
<div class="absolute bottom-10 left-5 floating-anim" style="animation-delay: 1.2s;">
<div class="glass-effect px-md py-sm rounded-full flex items-center gap-2 border-secondary/20">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-lg text-label-lg text-on-surface">Retention 98%</span>
</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center w-full max-w-md z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">
        Master Your Focus
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl leading-relaxed">
        Block distractions and boost retention with our intelligent focus mode and AI-generated flashcards.
      </p>
</div>
<!-- Pagination Dots -->
<div class="flex gap-sm mb-xl">
<div class="h-1.5 w-1.5 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-6 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-surface-variant"></div>
</div>
</main>
<!-- CTA Footer -->
<footer class="p-margin-mobile pb-xl flex flex-col items-center gap-md">
<button class="w-full max-w-md py-4 bg-secondary-container hover:bg-secondary-container/90 text-on-secondary-container font-label-lg text-label-lg rounded-xl transition-all duration-200 active:scale-[0.98] shadow-lg flex items-center justify-center gap-2" onclick="window.location.reload()">
      Next
      <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors">
      Skip Intro
    </button>
</footer>
<script>
    // Simple micro-interaction for the next button hover
    const btn = document.querySelector('button');
    btn.addEventListener('mouseover', () => {
      btn.style.boxShadow = "0 0 25px rgba(4, 180, 162, 0.4)";
    });
    btn.addEventListener('mouseleave', () => {
      btn.style.boxShadow = "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)";
    });
  </script>
</body></html>
