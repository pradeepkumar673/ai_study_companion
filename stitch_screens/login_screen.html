<!-- Micro-interaction Scripts -->
<script>
        // Simple ambient cursor glow effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            const glow = document.getElementById('mouse-glow');
            if (glow) {
                glow.style.transform = `translate(${x - 250}px, ${y - 250}px)`;
            }
        });

        // Add a floating glow div
        const glowDiv = document.createElement('div');
        glowDiv.id = 'mouse-glow';
        glowDiv.className = 'fixed top-0 left-0 w-[500px] h-[500px] rounded-full pointer-events-none z-0 opacity-20 transition-transform duration-300 ease-out';
        glowDiv.style.background = 'radial-gradient(circle, rgba(20, 184, 166, 0.3) 0%, transparent 70%)';
        document.body.prepend(glowDiv);
    </script>
