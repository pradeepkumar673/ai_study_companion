<style>
        .glass-card {
            background: rgba(23, 31, 51, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ai-glow {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }
        .ai-pulse {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.1); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }
        }
        .floating {
            animation: floating 4s infinite ease-in-out;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .chart-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 3s ease-in-out forwards;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">

<script>
        // Micro-interactions for the "Get Started" button
        const btn = document.querySelector('button');
        btn.addEventListener('mouseenter', () => {
            btn.classList.add('ai-glow');
        });
        btn.addEventListener('mouseleave', () => {
            btn.classList.remove('ai-glow');
        });

        // Simple parallax for floating elements on mouse move (Desktop Only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const amount = 20;
                const x = (e.clientX / window.innerWidth - 0.5) * amount;
                const y = (e.clientY / window.innerHeight - 0.5) * amount;
                
                document.querySelectorAll('.floating').forEach((el, index) => {
                    const factor = (index + 1) * 0.5;
                    el.style.transform = `translate3d(${x * factor}px, ${y * factor}px, 0)`;
                });
            });
        }
    </script>
