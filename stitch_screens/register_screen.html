<style>
        .glass-card {
            background: rgba(23, 31, 51, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);

        }

        }
        body {
            background: radial-gradient(circle at top right, #1e3a8a 0%, #0b1326 40%);

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {

<body class="text-on-surface font-body-md selection:bg-secondary/30">
<!-- Transactional Screen: Navigation suppressed per Shared Components Logic -->
<main class="flex min-h-screen items-center justify-center px-margin-mobile py-xl md:px-margin-desktop">
<div class="w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Branding/Logo Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 rounded-xl bg-gradient-to-br from-primary to-tertiary flex items-center justify-center mb-md ai-glow">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Join StudySpark and ignite your academic potential.</p>
</div>
<!-- Registration Form -->
<div class="glass-card rounded-xl p-md md:p-lg shadow-2xl">
<form action="#" class="space-y-lg" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1 transition-colors group-focus-within:text-secondary" for="full_name">Full Name</label>
<div class="relative ai-glow-focus transition-all duration-200 rounded-lg border border-outline-variant bg-surface-container-low focus-within:bg-surface-container">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-transparent border-none py-3 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="full_name" name="full_name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- University Email -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1 transition-colors group-focus-within:text-secondary" for="email">University Email</label>
<div class="relative ai-glow-focus transition-all duration-200 rounded-lg border border-outline-variant bg-surface-container-low focus-within:bg-surface-container">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">school</span>
<input class="w-full bg-transparent border-none py-3 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="email" name="email" placeholder="student@university.edu" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs group">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1 transition-colors group-focus-within:text-secondary" for="password">Password</label>
<div class="relative ai-glow-focus transition-all duration-200 rounded-lg border border-outline-variant bg-surface-container-low focus-within:bg-surface-container">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-transparent border-none py-3 pl-12 pr-12 text-on-surface placeholder:text-outline focus:ring-0 font-body-md" id="password" name="password" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-md py-xs">
<div class="flex h-6 items-center">
<input class="h-5 w-5 rounded border-outline-variant bg-surface-container-low text-secondary-container focus:ring-secondary focus:ring-offset-surface" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-label-sm font-label-sm">
<label class="text-on-surface-variant" for="terms">
                                I agree to the <a class="text-secondary hover:underline" href="#">Terms of Service</a> and <a class="text-secondary hover:underline" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-md px-lg bg-secondary-container text-on-secondary-container font-label-lg text-label-lg rounded-full flex items-center justify-center gap-base transition-all duration-200 hover:brightness-110 active:scale-[0.98] shadow-lg" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-lg pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-label-lg text-label-lg hover:underline transition-colors" href="#">Login</a>
</p>
</div>
</div>
<!-- Social/Alternative Registration -->
<div class="mt-xl">
<div class="flex items-center gap-md mb-lg">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Or continue with</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-base py-md rounded-lg bg-surface-container-high border border-outline-variant/30 hover:bg-surface-container-highest transition-colors">
<img alt="Google" class="w-5 h-5 grayscale opacity-70 group-hover:grayscale-0 group-hover:opacity-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWQLGCzAF2NEqTA_3RLS-V3fFx7wMLJBHozZBf0K5ibVHNyt0q51JizuN6N5W6zapN_3gqresVGQ4jdFGTGD3KV4hWRO0J50xo1upenz-Xo2BcQRwGjFypTn2vJhYH31eA5O-tYpkJGlEdVd-xjTCmrn8OR6yq91E72PFRlQVLkwxcKbr0SBCvpCraf0ZFFpd8qH8cqpTZcGZ8Aqy2PkcmSeiAVff4LCRb43w2ogXZ0V97FarrpL7meHGv8Q-ei9__WcCbbe090XU"/>
<span class="font-label-lg text-label-lg text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-base py-md rounded-lg bg-surface-container-high border border-outline-variant/30 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-label-lg text-label-lg text-on-surface">Apple</span>
</button>
</div>
</div>
</div>
</main>
<!-- Decorative Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full z-[-1]"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/10 blur-[120px] rounded-full z-[-1]"></div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerText = 'visibility';
            }
        }

        // Add subtle mouse move effect to the background
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            const root = document.documentElement;
            // No direct style manipulation for simple atmospheric effect, but we can animate the blobs
            const blobs = document.querySelectorAll('.fixed.z-\\[-1\\]');
            blobs[0].style.transform = `translate(${mouseX * 20}px, ${mouseY * 20}px)`;
            blobs[1].style.transform = `translate(${-mouseX * 20}px, ${-mouseY * 20}px)`;
        });
    </script>
</body></html>
