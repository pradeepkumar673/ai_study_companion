name: studyspark
description: StudySpark - Smart Student Productivity App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ────────────────────────────────────────────
  flutter_riverpod: ^2.5.1        # Reactive state management (v2 with code-gen support)
  riverpod_annotation: ^2.3.5     # @riverpod code-generation annotations

  # ─── Navigation ──────────────────────────────────────────────────
  go_router: ^14.2.7              # Declarative routing with deep-link support

  # ─── Local Database ──────────────────────────────────────────────
  isar: ^3.1.0+1                  # Blazing-fast embedded NoSQL database
  isar_flutter_libs: ^3.1.0+1     # Platform-specific Isar binaries
  path_provider: ^2.1.3           # Filesystem paths for DB storage

  # ─── UI & Theming ────────────────────────────────────────────────
  google_fonts: ^6.2.1            # 1000+ Google Fonts at runtime
  flex_color_scheme: ^7.3.1       # Advanced Material 3 theming
  flutter_animate: ^4.5.0         # Declarative animation chaining
  lottie: ^3.1.2                  # Lottie JSON animation player
  shimmer: ^3.0.0                 # Skeleton loading shimmer effect
  cached_network_image: ^3.3.1    # Network images with disk/memory cache
  fl_chart: ^0.68.0               # Beautiful animated charts
  percent_indicator: ^4.2.3       # Circular & linear progress indicators
  flutter_staggered_grid_view: ^0.7.0  # Masonry / staggered grid layouts
  gap: ^3.0.1                     # Type-safe SizedBox replacement

  # ─── Forms & Input ───────────────────────────────────────────────
  reactive_forms: ^17.0.1         # Reactive forms with validation
  flutter_colorpicker: ^1.1.0     # HSV color picker widget
  speech_to_text: ^7.0.0          # Voice-to-Notes live transcription
  image_picker: ^1.1.2            # Camera / gallery for scanner
  file_picker: ^8.1.2             # PDF file picker

  # ─── Notifications & Scheduling ──────────────────────────────────
  flutter_local_notifications: ^17.2.2   # Local push notifications
  timezone: ^0.9.4                # Timezone-aware scheduling

  # ─── Utilities ───────────────────────────────────────────────────
  intl: ^0.20.2                   # Internationalization & date formatting
  uuid: ^4.4.0                    # RFC 4122 UUID generation
  freezed_annotation: ^2.4.1      # Immutable data classes
  json_annotation: ^4.9.0         # JSON serialization annotations
  equatable: ^2.0.5               # Value equality without boilerplate
  collection: ^1.18.0             # Extended collection utilities
  logger: ^2.4.0                  # Pretty-printing structured logger
  shared_preferences: ^2.3.1      # Key-value persistence for settings


  # ─── AI / HTTP ───────────────────────────────────────────────────
  dio: ^5.5.0+1                   # HTTP client for API calls
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0

  # ─── Icons & Assets ──────────────────────────────────────────────
  hugeicons: ^0.0.7               # 3800+ Huge icon pack
  flutter_svg: ^2.0.10+1          # SVG rendering
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ─── Code Generation ─────────────────────────────────────────────
  build_runner: ^2.4.11           # Source-code generation runner
  riverpod_generator: 2.4.0      # Generates @riverpod providers
  freezed: ^2.5.2                 # Generates immutable unions & data classes
  json_serializable: ^6.8.0       # Generates fromJson/toJson
  isar_generator: ^3.1.0+1        # Generates Isar schema code
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # ─── Assets ──────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/         # Lottie JSON files
    - assets/splash/

# ─────────────────────────────────────────────────────────────────
# App Icon Configuration
# ─────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  android_adaptive_icon:
    background_color: "#6C4FF8"
    foreground_image: "assets/images/icon_foreground.png"

# ─────────────────────────────────────────────────────────────────
# Native Splash Screen Configuration
# ─────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#6C4FF8"
  color_dark: "#1A1040"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android_12:
    color: "#6C4FF8"
    image: assets/splash/splash_logo.png
    icon_background_color: "#6C4FF8"
    color_dark: "#1A1040"
    image_dark: assets/splash/splash_logo.png
  fullscreen: true
  android: true
  ios: true

  # ─── Fonts (supplemented by google_fonts at runtime) ─────────────
  # Google Fonts used: Clash Display (display), DM Sans (body)
  # These are loaded via google_fonts package — no manual font listing needed
